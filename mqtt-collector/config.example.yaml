# ─────────────────────────────────────────────────────────────
# mqtt-collector 설정 예시
#  - 비밀값은 ${VAR} 로 쓰고, 실제 값은 /etc/mqtt-collector/env 에 둔다.
#  - 아래 sensors 규칙의 토픽/키 이름은 "예시"다. MQTT Explorer 에서 본
#    실제 토픽 구조와 payload 에 맞춰 고쳐야 한다. (가이드 2단계)
#  - 고친 뒤:  sudo systemctl restart mqtt-collector
# ─────────────────────────────────────────────────────────────
mqtt:
  host: ${MQTT_HOST}
  port: ${MQTT_PORT}
  username: ${MQTT_USERNAME}
  password: ${MQTT_PASSWORD}
  client_id: aip-collector-jetson01   # 고정 ID + clean_session false => 잠깐 끊긴 사이 QoS1 메시지를 브로커가 보관
  clean_session: false
  qos: 1
  keepalive: 30            # 30초 동안 응답 없으면 끊긴 것으로 판단
  reconnect_max_s: 10      # 재접속 간격 최대 10초 => "1분 안에 복구" 기준 충족
  # tls: true
  # ca_certs: /etc/ssl/certs/ca-certificates.crt
  # subscribe: ["#"]       # 생략하면 sensors 의 topic 들을 구독

influx:
  url: ${INFLUX_URL}       # 예: http://10.8.0.1:8086  (원격 서버 가정)
  org: ${INFLUX_ORG}
  bucket: ${INFLUX_BUCKET}
  token: ${INFLUX_TOKEN}
  batch_size: 500
  flush_interval_s: 2
  timeout_ms: 10000

spool_path: ./spool.db   # Influx 장애 시 임시 저장 (설치 폴더 기준)
health_interval_s: 60

defaults:
  measurement: sensor
  max_clock_skew_s: 300    # 센서 시각이 수신 시각과 5분 넘게 다르면 수신 시각을 쓴다
  tz_offset_h: 9           # 시간대 없는 ISO 문자열은 KST 로 해석

dedup:
  enabled: true            # 같은 (센서, 항목, 센서시각) 재전송을 세고 건너뛴다
  window: 50000            # 최근 몇 개 키를 기억할지

# 위에서부터 처음 맞는 규칙 하나가 적용된다.
# tags 템플릿:  {t0},{t1}.. = 토픽의 n번째 조각(0부터),  {p:a.b} = payload 경로,  {topic} = 전체 토픽
# items: 항목 이름(name)과 payload 경로(path). path 를 리스트로 주면 처음 값이 있는 경로를 쓴다.
# auto_items: true 면 payload 의 숫자 키를 전부 항목으로 저장 (새 키가 생겨도 설정 변경 불필요)
sensors:
  # ── 교육장(강의실 2, 회의실 1, 라운지 1) × CO2·온도·습도, 1분 주기 ─────────
  # 실제 토픽/키 이름은 MQTT Explorer 에서 확인한 대로 바꾼다. 흔한 두 가지 모양을 예로 둔다.

  # 모양 A) 공간마다 한 메시지에 세 값이 같이 온다
  #   토픽 = aip/<공간>/env     예: aip/classroom1/env
  #   payload = {"ts":"2026-10-20T09:00:00+09:00","co2":812,"temperature":24.1,"humidity":41.5}
  - topic: "aip/+/env"
    format: json
    tags:
      space: "{t1}"                       # classroom1 / classroom2 / meeting1 / lounge1
    time: {path: [ts, timestamp, time], unit: auto}
    items:
      - {name: co2,         path: [co2, CO2, co2_ppm]}
      - {name: temperature, path: [temperature, temp, t]}
      - {name: humidity,    path: [humidity, hum, rh]}

  # 모양 B) 항목마다 토픽이 따로 있고 값만 온다
  #   토픽 = aip/<공간>/<항목>   예: aip/lounge1/co2   payload = "812"
  # - topic: "aip/+/+"
  #   format: plain
  #   tags: {space: "{t1}"}
  #   items:
  #     - {name: "{t2}", path: value}      # ← 항목 이름을 토픽에서 가져오려면 아래 주석 참고

  # 참고: 0ppm 같은 깨진 값도 걸러 내지 않고 그대로 저장한다.
  #       수집 단계에서 지우면 "센서가 이상했다"는 사실 자체가 사라져서 과제 4(이상 탐지)의 재료가 없어진다.
  #       정제는 과제 2에서 읽을 때 한다.
